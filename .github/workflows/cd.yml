name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/devops-project-demo/devops-app

jobs:
  build-and-push:
    environment: main
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP using Workload Identity Federation
        id: gcpauth
        uses: "google-github-actions/auth@v3"
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: "access_token"

      - name: "Docker Auth"
        uses: "docker/login-action@v3"
        with:
          username: "oauth2accesstoken"
          password: "${{ steps.gcpauth.outputs.access_token }}"
          registry: "europe-west3-docker.pkg.dev"

      - name: GCR configuration
        run: |
          gcloud auth configure-docker

      - name: Check image in registry
        id: check-image
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE=${{ env.IMAGE_NAME }}
          if gcloud container images list-tags "$IMAGE" --filter="tags=$IMAGE_TAG" --format='get(tags)' --limit=1 | grep -q "$IMAGE_TAG"; then
            echo "Image $IMAGE:$IMAGE_TAG already exists in registry"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image to GCR
        if: steps.check-image.outputs.exists == 'false'
        run: |
          IMAGE_TAG=${{ github.sha }}
          gcloud auth configure-docker
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

      - name: Set output image
        id: meta
        run: echo "image=$IMAGE_NAME:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    environment: main
    permissions:
      contents: read
      id-token: write
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP using Workload Identity Federation
        uses: "google-github-actions/auth@v3"
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: "autopilot-cluster-1"
          location: "us-central1"
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to cluster
        run: |
          IMAGE=${{ needs.build-and-push.outputs.image }}
          export IMAGE
          sudo apt-get update && sudo apt-get install -y gettext-base
          REPLICAS=1 envsubst < infra/k8s/deployment.yml | kubectl apply -f - || kubectl set image deployment/devops-deployment devops-container=$IMAGE --namespace default
