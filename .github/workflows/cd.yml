name: CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    branches: ["main"]

jobs:
  build-and-push:
    environment: main
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check-image.outputs.build }}
      version: ${{ steps.pkg.outputs.version }}
      image_name: ${{ steps.image.outputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: |
          IMAGE_NAME="${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_NAME }}/${{ vars.IMAGE_NAME }}"
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Resolve image version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Authenticate to GCP
        id: gcpauth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: GCR configuration
        run: |
          gcloud auth configure-docker --quiet ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev

      - name: Check image in registry
        id: check-image
        run: |
          IMAGE_TAG=${{ steps.pkg.outputs.version }}
          IMAGE=${{ steps.image.outputs.image_name }}

          if gcloud container images list-tags "$IMAGE" \
            --filter="tags=$IMAGE_TAG" \
            --format='get(tags)' \
            --limit=1 | grep -q "$IMAGE_TAG"; then
            echo "Image $IMAGE:$IMAGE_TAG already exists in registry. Skipping build and push."
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "Image $IMAGE:$IMAGE_TAG does not exist in registry. Will build and push."
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image to GCR
        if: steps.check-image.outputs.build == 'true'
        run: |
          IMAGE_TAG=${{ github.sha }}
          IMAGE=${{ steps.image.outputs.image_name }}

          docker build -t $IMAGE:$IMAGE_TAG .
          docker push $IMAGE:$IMAGE_TAG

  trivy-scan:
    needs: build-and-push
    if: needs.build-and-push.outputs.build == 'true'
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image: ${{ needs.build-and-push.outputs.image_name }}:${{ github.sha }}
      build: false

  publish-image:
    needs: [build-and-push, trivy-scan]
    runs-on: ubuntu-latest
    if: needs.build-and-push.outputs.build == 'true'
    steps:
      - name: Authenticate to GCP
        id: gcpauth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: GCR configuration
        run: |
          gcloud auth configure-docker --quiet ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev

      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.gcpauth.outputs.access_token }}
          registry: ${{ vars.GCP_ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev

      - name: Publish Image
        run: |
          IMAGE_NAME=${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG=${{ needs.build-and-push.outputs.version }}
          IMAGE_SHA=${{ github.sha }}

          docker tag $IMAGE_NAME:$IMAGE_SHA $IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_SHA $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$IMAGE_TAG

  deploy:
    environment: main
    permissions:
      contents: read
      id-token: write
    needs: ["build-and-push", "publish-image"]
    if: always() && github.ref == 'refs/heads/main' &&
      (
      needs.build-and-push.outputs.build == 'false' ||
      needs.publish-image.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ vars.GCP_GKE_CLUSTER_NAME }}
          location: ${{ vars.GCP_GKE_CLUSTER_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to cluster
        run: |
          IMAGE_NAME=${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG=${{ needs.build-and-push.outputs.version }}

          export IMAGE=${IMAGE_NAME}:${IMAGE_TAG}
          export REPLICAS=1
          export DEPLOYMENT=devops-deployment
          export APP=devops-app
          export NAMESPACE=default
          export SERVICE=devops-service
          export CONTAINER=devops-container

          envsubst < infra/k8s/deployment.yml | kubectl apply -f -
          kubectl rollout status deployment/${DEPLOYMENT} --namespace ${NAMESPACE}

      - name: Resolve Public IP
        run: |
          echo "Waiting for external IP or hostname for service ${SERVICE}..."
          for i in {1..6}; do
            ip=$(kubectl get svc ${SERVICE} -n ${NAMESPACE} -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [ -n "$ip" ]; then
              echo "Service ${SERVICE} external IP: $ip"
              exit 0
            fi

            host=$(kubectl get svc ${SERVICE} -n ${NAMESPACE} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$host" ]; then
              echo "Service ${SERVICE} external hostname: $host"
              exit 0
            fi

            echo "Attempt $i: external endpoint not yet assigned. Waiting..."
            sleep 5
          done

          echo "Timed out waiting for LoadBalancer IP/hostname for service ${SERVICE}"
          kubectl get svc ${SERVICE} -n ${NAMESPACE} -o wide
          exit 1
