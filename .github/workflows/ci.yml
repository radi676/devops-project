name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run Snyk check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

      - name: Run TruffleHog scan for secrets
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --debug

      #- name: SonarQube Scan
      #  continue-on-error: true
      #  uses: SonarSource/sonarqube-scan-action@v7.0.0
      #  with:
      #    projectBaseDir: app/src
      #    args: >
      #      -Dsonar.organization=my-organization
      #      "-Dsonar.projectName=My Project"
      #      -Dsonar.projectKey=my-projectkey
      #      -Dsonar.sources=src/
      #      -Dsonar.tests=tests/
      #      -Dsonar.verbose=true

      - name: Trivy Scan
        id: trivy
        uses: .github/workflows/trivy-scan.yml
        continue-on-error: true
        with:
          image: devops-app:${{ github.sha }}

      - name: Run tests
        continue-on-error: true
        run: npm test

      - name: Fail if any step failed
        if: ${{ steps.lint.outcome == 'failure' || steps.snyk.outcome == 'failure' || steps.trufflehog.outcome == 'failure' || steps.test.outcome == 'failure' || steps.trivy.outcome == 'failure' }}
        run: |
          echo "One or more checks failed. Failing the workflow."
          exit 1
