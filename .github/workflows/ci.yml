name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Run Snyk check for vulnerabilities
        id: snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

      - name: Run TruffleHog scan for secrets
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ""
          head: HEAD

      - name: Run tests
        id: test
        run: npm test
        continue-on-error: true

      - name: Analyze results
        run: |
          echo "Lint result: ${{ steps.lint.outcome }}"
          echo "Snyk result: ${{ steps.snyk.outcome }}"
          echo "TruffleHog result: ${{ steps.trufflehog.outcome }}"
          echo "Test result: ${{ steps.test.outcome }}"
          if [[ "${{ steps.lint.outcome }}" == "failure" || "${{ steps.snyk.outcome }}" == "failure" || "${{ steps.trufflehog.outcome }}" == "failure" || "${{ steps.test.outcome }}" == "failure" ]]; then
            echo "One or more checks failed."
            exit 1
          else
            echo "All checks passed."
          fi

  trivy-scan:
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image: devops-app:${{ github.sha }}
      build: true
