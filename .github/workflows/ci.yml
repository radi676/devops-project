name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-scan:
    name: Test and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Run Snyk check for vulnerabilities
        id: snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

      - name: Run TruffleHog scan for secrets
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ""
          head: HEAD

      - name: Run tests
        id: test
        run: npm test
        continue-on-error: true

      - name: Check version
        id: version-check
        continue-on-error: true
        run: |
          PR_VERSION=$(jq -r '.version' package.json)
          echo "PR_VERSION=$VERSION"

          git fetch origin main
          MAIN_VERSION=$(git show origin/main:package.json | jq -r '.version')
          echo "MAIN_VERSION=$MAIN_VERSION"

          MAJOR_PR=$(echo "$PR_VERSION" | cut -d. -f1)
          MINOR_PR=$(echo "$PR_VERSION" | cut -d. -f2)
          PATCH_PR=$(echo "$PR_VERSION" | cut -d. -f3)

          MAJOR_MAIN=$(echo "$MAIN_VERSION" | cut -d. -f1)
          MINOR_MAIN=$(echo "$MAIN_VERSION" | cut -d. -f2)
          PATCH_MAIN=$(echo "$MAIN_VERSION" | cut -d. -f3)

          echo "Comparing $MAIN_VERSION -> $PR_VERSION"

          if [ "$MAJOR_PR" -lt "$MAJOR_MAIN" ] || \
             { [ "$MAJOR_PR" -eq "$MAJOR_MAIN" ] && [ "$MINOR_PR" -lt "$MINOR_MAIN" ]; } || \
             { [ "$MAJOR_PR" -eq "$MAJOR_MAIN" ] && [ "$MINOR_PR" -eq "$MINOR_MAIN" ] && [ "$PATCH_PR" -le "$PATCH_MAIN" ]; }; then
            echo "Error: version must be strictly greater than main ($MAIN_VERSION → $PR_VERSION)"
            exit 1
          fi

          echo "Version correctly bumped: $MAIN_VERSION → $PR_VERSION"

      - name: Analyze results
        run: |
          echo "Lint result: ${{ steps.lint.outcome }}"
          echo "Snyk result: ${{ steps.snyk.outcome }}"
          echo "TruffleHog result: ${{ steps.trufflehog.outcome }}"
          echo "Test result: ${{ steps.test.outcome }}"
          if [[ "${{ steps.lint.outcome }}" == "failure" \
                || "${{ steps.snyk.outcome }}" == "failure" \
                || "${{ steps.trufflehog.outcome }}" == "failure" \
                || "${{ steps.test.outcome }}" == "failure" \
                || "${{ steps.version-check.outcome }}" == "failure" ]]; then
            echo "One or more checks failed."
            exit 1
          else
            echo "All checks passed."
          fi

  trivy-scan:
    name: Trivy Scan
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image: devops-app:${{ github.sha }}
      build: true
