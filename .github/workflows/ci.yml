name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    outputs:
      lint: ${{ steps.lint.outcome }}
      snyk: ${{ steps.snyk.outcome }}
      trufflehog: ${{ steps.trufflehog.outcome }}
      test: ${{ steps.test.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Run Snyk check for vulnerabilities
        id: snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

      - name: Run TruffleHog scan for secrets
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ""
          head: HEAD

      - name: Run tests
        id: test
        run: npm test
        continue-on-error: true
  trivy-scan:
    uses: radi676/devops-project/.github/workflows/trivy-scan.yml
    continue-on-error: true
    with:
      image: devops-app:${{ github.sha }}
  final-status:
    runs-on: ubuntu-latest
    needs: [test-and-scan, trivy-scan]

    if: |
      needs.test-and-scan.outputs.lint == 'failure' ||
      needs.test-and-scan.outputs.snyk == 'failure' ||
      needs.test-and-scan.outputs.trufflehog == 'failure' ||
      needs.test-and-scan.outputs.test == 'failure' ||
      needs.trivy-scan.result == 'failure'

    steps:
      - name: Fail workflow if any check failed
        run: |
          echo "One or more checks failed. Failing the workflow."
          exit 1
